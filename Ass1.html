<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shape Area Calculator</title>
  </head>
  <body>
    <div class="container">
      <h1>Shape Area Calculator</h1>
      <p>Enter the dimensions to calculate area.</p>

      <!-- Triangle -->
      <div class="shape">
        <h2>Triangle</h2>
        <input type="number" id="a" placeholder="Side A" />
        <input type="number" id="b" placeholder="Side B" />
        <input type="number" id="c" placeholder="Side C" />
        <button onclick="triangleArea()">Calculate</button>
        <p id="triangleResult" class="result"></p>
      </div>

      <!-- Rectangle -->
      <div class="shape">
        <h2>Rectangle</h2>
        <input type="number" id="length" placeholder="Length" />
        <input type="number" id="width" placeholder="Width" />
        <button onclick="rectangleArea()">Calculate</button>
        <p id="rectangleResult" class="result"></p>
      </div>

      <!-- Circle -->
      <div class="shape">
        <h2>Circle</h2>
        <input type="number" id="radius" placeholder="Radius" />
        <button onclick="circleArea()">Calculate</button>
        <p id="circleResult" class="result"></p>
      </div>
    </div>

    <script>
      function valid(num) {
        return !isNaN(num) && num > 0;
      }

      // Triangle Area using Heron's formula
      function triangleArea() {
        let a = parseFloat(document.getElementById("a").value);
        let b = parseFloat(document.getElementById("b").value);
        let c = parseFloat(document.getElementById("c").value);

        let result = document.getElementById("triangleResult");

        if (!valid(a) || !valid(b) || !valid(c)) {
          result.innerHTML = "Enter valid positive numbers.";
          result.className = "result error";
          return;
        }

        if (a + b <= c || a + c <= b || b + c <= a) {
          result.innerHTML = "Such sides do not form a triangle.";
          result.className = "result error";
          return;
        }

        let s = (a + b + c) / 2;
        let area = Math.sqrt(s * (s - a) * (s - b) * (s - c));

        result.className = "result";
        result.innerHTML = "Area = " + area.toFixed(2) + " sq. units";
      }

      // Rectangle Area
      function rectangleArea() {
        let l = parseFloat(document.getElementById("length").value);
        let w = parseFloat(document.getElementById("width").value);

        let result = document.getElementById("rectangleResult");

        if (!valid(l) || !valid(w)) {
          result.innerHTML = "Enter valid positive numbers.";
          result.className = "result error";
          return;
        }

        result.className = "result";
        result.innerHTML = "Area = " + (l * w).toFixed(2) + " sq. units";
      }

      // Circle Area
      function circleArea() {
        let r = parseFloat(document.getElementById("radius").value);

        let result = document.getElementById("circleResult");

        if (!valid(r)) {
          result.innerHTML = "Enter a valid positive radius.";
          result.className = "result error";
          return;
        }

        let area = Math.PI * r * r;

        result.className = "result";
        result.innerHTML = "Area = " + area.toFixed(2) + " sq. units";
      }
    </script>
  </body>
</html>
