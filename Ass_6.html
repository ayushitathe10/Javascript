<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Array Operation</title>
  </head>
  <body>
    <h2>Array Operations</h2>

    <h3>Create Array</h3>
    <input type="text" id="arrayInput" />
    <button onclick="createArray()">Create Array</button>

    <h3>Remove Element</h3>
    <input type="text" id="removeValue" />
    <button onclick="removeElement()">Remove Element</button>

    <h3>Search Element</h3>
    <input type="text" id="checkValue" />
    <button onclick="checkContains()">Check Value</button>

    <h3>Clear Array</h3>
    <button onclick="emptyArray()">Empty Array</button>

    <h3>Output</h3>
    <div id="result">No array is created yet</div>

    <script>
      let myArray = [];

      // 1. Create Array
      function createArray() {
        let input = document.getElementById("arrayInput").value;

        myArray = input.split(","); //split() means divide the string into an array.

        for (let i = 0; i < myArray.length; i++) {
          myArray[i] = myArray[i].trim(); //trim() removes unnecessary spaces from the beginning and end of a string.
        }

        showResult("Array created successfully");
      }

      // 2. Remove Element
      function removeElement() {
        let value = document.getElementById("removeValue").value;
        let found = false;

        for (let i = 0; i < myArray.length; i++) {
          if (myArray[i].toLowerCase() == value.toLowerCase()) {
            myArray.splice(i, 1); //splice() removes elements from an array.
            found = true; // splice(startIndex, deleteCount) i = Position from where we want to remove. 1 = Remove only one element.
            break;
          }
        }

        if (found == true) {
          showResult("Element removed");
        } else {
          showResult("Element is not found");
        }
      }

      // 3. Search Element
      function checkContains() {
        let value = document.getElementById("checkValue").value;
        let found = false;

        for (let i = 0; i < myArray.length; i++) {
          if (myArray[i].toLowerCase() == value.toLowerCase()) {
            found = true;
            break;
          }
        }

        if (found == true) {
          showResult("Element exists in array");
        } else {
          showResult("Element does not exist");
        }
      }

      // 4. Empty Array
      function emptyArray() {
        myArray = [];
        document.getElementById("arrayInput").value = "";
        showResult("Array emptied successfully");
      }

      // 5. Display Result
      function showResult(message) {
        let result = document.getElementById("result");

        result.innerHTML = message + "<br><br>";
        result.innerHTML += "Current Array: ";

        for (let i = 0; i < myArray.length; i++) {
          result.innerHTML += myArray[i] + " ";
        }

        if (myArray.length == 0) {
          result.innerHTML += "Array is empty";
        }
      }
    </script>
  </body>
</html>
