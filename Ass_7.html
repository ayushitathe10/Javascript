<!doctype html>
<html>
  <head>
    <title>Array and Object</title>
  </head>

  <body>
    <h2>Array and Object Operations</h2>

    Enter array elements (comma separated):
    <input type="text" id="arrayInput" />
    <br /><br />

    Enter object name:
    <input type="text" id="nameInput" />
    <br /><br />

    Enter object age:
    <input type="text" id="ageInput" />
    <br /><br />

    <button onclick="addObject()">Add Object</button>

    <p id="result"></p>

    <script>
      function addObject() {
        // Get array input
        let input = document.getElementById("arrayInput").value;

        // Convert input into correct data types
        let myArray = input.split(",").map((item) => {
          item = item.trim();

          if (item === "true") return true;

          if (item === "false") return false;

          if (item !== "" && !isNaN(item)) {
            return Number(item);
          }

          return item;
        });

        // Get object details
        let name = document.getElementById("nameInput").value;

        let age = Number(document.getElementById("ageInput").value);

        // Create object
        let obj = {
          name: name,
          age: age,
        };

        // Append object to array
        myArray.push(obj);

        let output = "";

        // Display updated array
        output += "<h3>Updated Array:</h3>";
        output += JSON.stringify(myArray) + "<br>";

        // Check array type
        output += "<br>Type of Array: " + typeof myArray;
        output += "<br>Is myArray an array? " + Array.isArray(myArray);

        // Display array elements and their types
        output += "<h3>Array Elements and Types:</h3>";

        myArray.forEach(function (item, index) {
          output +=
            "Element " +
            index +
            ": " +
            JSON.stringify(item) +
            " | Type: " +
            typeof item +
            "<br>";
        });

        // Display result
        document.getElementById("result").innerHTML = output;
      }
    </script>
  </body>
</html>
