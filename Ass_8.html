<!doctype html>
<html>
  <head>
    <title>Experiment 8 - Mouse Over and Focus</title>

    <style>
      body {
        font-family: Arial;
        text-align: center;
        background-color: white;
      }

      .card {
        background-color: white;
        padding: 30px;
        margin: 100px auto;
        width: 400px;
      }

      button {
        padding: 10px;
        margin: 10px;
        background-color: blue;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Mouse Over and Focus Events</h2>

      <button
        onmouseover="changeBackground('hover')"
        onmouseleave="changeBackground('reset')"
      >
        Mouse Over Event
      </button>

      <button
        onfocus="changeBackground('focus')"
        onblur="changeBackground('reset')"
      >
        Focus Event
      </button>

      <p>
        Move the mouse over the first button or click the second button to
        change the background colour.
      </p>
    </div>

    <script>
      function changeBackground(type) {
        if (type === "hover") {
          document.body.style.backgroundColor = "lightblue";
        } else if (type === "focus") {
          document.body.style.backgroundColor = "black";
        } else {
          document.body.style.backgroundColor = "white";
        }
      }
    </script>
  </body>
</html>
