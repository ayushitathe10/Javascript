<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 9 - Student Information Form</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
      }

      h1 {
        text-align: center;
        color: #333;
      }

      .info {
        text-align: center;
        margin-bottom: 20px;
        color: #555;
      }

      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 9px;
        margin-top: 5px;
        box-sizing: border-box;
        border: 1px solid #aaa;
        border-radius: 5px;
      }

      textarea {
        height: 70px;
        resize: vertical;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background-color: #555;
      }

      .success-container {
        max-width: 600px;
        margin: 30px auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px #ccc;
      }

      .success-container h1 {
        color: #2f63a7;
      }

      .success-container table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      .success-container th,
      .success-container td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
        overflow-wrap: anywhere;
      }

      .success-container th {
        background: #eaf4ff;
      }
    </style>
  </head>

  <body>
    <div class="container" id="formContainer">
      <h1>Student Information Form</h1>

      <form id="studentForm" onsubmit="return validateForm();">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter your name" />

        <label for="address">Address:</label>
        <textarea id="address" placeholder="Enter your address"></textarea>

        <label for="city">City:</label>
        <input type="text" id="city" placeholder="Enter your city" />

        <label for="state">State:</label>
        <input type="text" id="state" placeholder="Enter your state" />

        <label for="gender">Gender:</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>

        <label for="mobile">Mobile Number:</label>
        <input
          type="text"
          id="mobile"
          placeholder="Enter 10 digit mobile number"
          maxlength="10"
        />

        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter your email" />

        <button type="submit">Submit</button>
      </form>
    </div>

    <script>
      function validateForm() {
        // Get entered values
        const name = document.getElementById("name").value.trim();
        const address = document.getElementById("address").value.trim();
        const city = document.getElementById("city").value.trim();
        const state = document.getElementById("state").value.trim();
        const gender = document.getElementById("gender").value;
        const mobile = document.getElementById("mobile").value.trim();
        const email = document.getElementById("email").value.trim();

        // Regular expressions
        const namePattern = /^[a-zA-Z\s]+$/;
        const addressPattern = /^[a-zA-Z0-9\s,./#-]+$/;
        const cityStatePattern = /^[a-zA-Z\s]+$/;
        const mobilePattern = /^[0-9]{10}$/;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Check empty fields
        if (
          name === "" ||
          address === "" ||
          city === "" ||
          state === "" ||
          gender === "" ||
          mobile === "" ||
          email === ""
        ) {
          alert("Please fill in all the fields.");
          return false;
        }

        // Validate name
        if (!namePattern.test(name)) {
          alert("Please enter a valid name.");
          return false;
        }

        // Validate address
        if (!addressPattern.test(address)) {
          alert("Please enter a valid address.");
          return false;
        }

        // Validate city
        if (!cityStatePattern.test(city)) {
          alert("Please enter a valid city.");
          return false;
        }

        // Validate state
        if (!cityStatePattern.test(state)) {
          alert("Please enter a valid state.");
          return false;
        }

        // Validate mobile number
        if (!mobilePattern.test(mobile)) {
          alert("Mobile number must contain exactly 10 digits.");
          return false;
        }

        // Validate email
        if (!emailPattern.test(email)) {
          alert("Please enter a valid email address.");
          return false;
        }

        // All validations passed
        showSuccessPage(name, address, city, state, gender, mobile, email);

        return false;
      }

      function showSuccessPage(
        name,
        address,
        city,
        state,
        gender,
        mobile,
        email,
      ) {
        const details = [
          ["Full Name", name],
          ["Address", address],
          ["City", city],
          ["State", state],
          ["Gender", gender],
          ["Mobile Number", mobile],
          ["Email", email],
        ];

        // Create the success page
        document.body.replaceChildren();

        const container = document.createElement("div");
        container.className = "success-container";

        const heading = document.createElement("h1");
        heading.textContent = "Congratulations!";
        container.appendChild(heading);

        const welcome = document.createElement("h2");
        welcome.textContent = "Welcome, " + name + "!";
        container.appendChild(welcome);

        const message = document.createElement("p");
        message.textContent =
          "Your student information has been submitted successfully.";
        container.appendChild(message);

        const subheading = document.createElement("h3");
        subheading.textContent = "Submitted Student Details";
        container.appendChild(subheading);

        const table = document.createElement("table");

        const header = document.createElement("tr");

        const fieldHeader = document.createElement("th");
        fieldHeader.textContent = "Field";
        header.appendChild(fieldHeader);

        const valueHeader = document.createElement("th");
        valueHeader.textContent = "Details";
        header.appendChild(valueHeader);

        table.appendChild(header);

        details.forEach(function (item) {
          const row = document.createElement("tr");

          const field = document.createElement("td");
          field.textContent = item[0];

          const value = document.createElement("td");
          value.textContent = item[1];

          row.appendChild(field);
          row.appendChild(value);
          table.appendChild(row);
        });

        container.appendChild(table);
        document.body.appendChild(container);
      }
    </script>
  </body>
</html>
